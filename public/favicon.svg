<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#3b7df0"/>
      <stop offset="1" stop-color="#1c2b5a"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.35" stop-color="#f5c518"/>
      <stop offset="0.8" stop-color="#d98d0b"/>
      <stop offset="1" stop-color="#8f5a05"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8760a"/>
      <stop offset="1" stop-color="#5e3b02"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2500"/>
      <stop offset="1" stop-color="#1a1000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.92"/>
      <feOffset dx="0" dy="2.24" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14.08" ry="14.08" fill="url(#bg)"/>
  <!-- soft highlight in the corner -->
  <circle cx="14.08" cy="11.52" r="32" fill="url(#glow)"/>
  <!-- little plate behind the screw -->
  <rect x="2.6239999999999952" y="9.151999999999997" width="58.75200000000001" height="45.696000000000005" rx="7.616"
        fill="#2ec4d6" opacity="0.95" transform="rotate(-8 32 32)" filter="url(#shadow)"/>
  <rect x="2.6239999999999952" y="9.151999999999997" width="58.75200000000001" height="10.88" rx="5.44"
        fill="#ffffff" opacity="0.18" transform="rotate(-8 32 32)"/>
  <!-- screw head -->
  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="21.76" fill="url(#rim)"/>
    <circle cx="32" cy="30.62912" r="20.4544" fill="url(#dome)"/>
  </g>
  <!-- phillips cross -->
  <g transform="translate(32 30.62912)">
    <rect x="-7.833600000000001" y="-1.9584000000000001" width="15.667200000000001" height="3.9168000000000003" rx="1.5667200000000001" fill="url(#slot)"/>
    <rect x="-1.9584000000000001" y="-7.833600000000001" width="3.9168000000000003" height="15.667200000000001" rx="1.5667200000000001" fill="url(#slot)"/>
    <rect x="-7.246080000000001" y="-1.37088" width="14.492160000000002" height="0.9792000000000001" rx="0.470016" fill="#000" opacity="0.35"/>
  </g>
  <!-- specular -->
  <ellipse cx="24.384" cy="21.119999999999997" rx="6.092800000000001" ry="3.4816000000000003" fill="#fff" opacity="0.55" transform="rotate(-30 24.384 21.119999999999997)"/>
</svg>